<!DOCTYPE html>
<html>

<head>
    <title>AI Voice Agent</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
            padding: 60px;
        }

        .container {
            background: white;
            max-width: 700px;
            margin: auto;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #1f2937;
        }

        p {
            color: #555;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🤖 AI Appointment Booking Agent</h1>

        <p>
            Talk to our AI assistant to book an appointment.
        </p>

        <!-- Vapi Voice Agent -->
        <script
            src="https://unpkg.com/@vapi-ai/client-sdk-react/dist/embed/widget.umd.js"
            async
            type="text/javascript">
        </script>

        <vapi-widget
            public-key="f49b3652-9dd9-4f47-9597-ed24076e5885"
            assistant-id="02712fdf-b0aa-410d-b0fe-d9bc77021260"
            mode="voice"
            size="compact"
            theme="light"
            radius="large"
            main-label="AI Appointment Assistant"
            start-button-text="Start Voice Call"
            end-button-text="End Call"
            empty-voice-message="Click Start to talk with the AI assistant">
        </vapi-widget>

    </div>

</body>

</html>
